<!DOCTYPE html>
<!-- ============================================================
     formulario.html — Página 4 · Formulário: criar/editar post e editar perfil.
     ============================================================ -->
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <!-- Viewport: obrigatório para o site ser responsivo em telemóveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar · BusCheck</title>
  <link rel="stylesheet" href="Css/style.css">
</head>
<body>
  <a class="skip" href="#conteudo">Saltar para o conteúdo</a>

  <!-- TOPO: logótipo + botão Entrar (só visível no telemóvel).
       BACKEND: se houver sessão iniciada, mostrar o avatar/nome e "Sair" em vez de "Entrar". -->
  <header class="topbar">
    <a href="index.html" class="logo" aria-label="BusCheck, página inicial">Bus<span>Check</span></a>
    <a href="login.html" class="btn btn--sm">Entrar</a>
  </header>

  <!-- MENU PRINCIPAL: no telemóvel é a barra inferior; no computador é o menu lateral (só CSS).
         aria-current="page" marca a página ativa. BACKEND: ao passar para PHP, pôr isto em includes/nav.php
         e gerar o aria-current com basename($_SERVER['PHP_SELF']). -->
  <nav class="nav" aria-label="Principal">
    <a href="index.html" ><span class="ico" aria-hidden="true">🏠</span>Início</a>
    <a href="posts.html" ><span class="ico" aria-hidden="true">🔎</span>Posts</a>
    <a href="formulario.html" aria-current="page"><span class="ico" aria-hidden="true">➕</span>Publicar</a>
    <a href="perfil.html" ><span class="ico" aria-hidden="true">👤</span>Perfil</a>
    <a href="login.html" class="nav-desk" ><span class="ico" aria-hidden="true">🔑</span>Entrar</a>
  </nav>

  <!-- CONTEÚDO PRINCIPAL (um único <main> por página) -->
  <main id="conteudo">

    <!-- ===== CRIAR / EDITAR POST ===== -->
    <section class="card" aria-labelledby="t-post">
      <h1 id="t-post">Novo post</h1>
      <!-- BACKEND: action="php/guardar_post.php". Os atributos name= coincidem com as colunas da BD.
           MODO EDITAR: preencher value= com os dados atuais e ter <input type="hidden" name="post_id">.
           O servidor deve confirmar que o post pertence ao utilizador com sessão. -->
      <form class="form" method="post" action="php/guardar_post.php">
        <input type="hidden" name="post_id" value=""><!-- vazio = criar; com id = editar -->
        <div class="field"><label for="titulo">Título</label>
          <input id="titulo" name="titulo" maxlength="100" placeholder="Ex.: 301 atrasado na Trindade" required></div>
        <div class="field"><label for="linha-f">Linha de autocarro</label>
          <select id="linha-f" name="linha" required><option value="">Escolhe a linha</option><option>301</option><option>502</option><option>801</option><option>205</option><option>903</option></select></div>
        <div class="field"><label for="tipo">Tipo de ocorrência</label>
          <select id="tipo" name="tipo"><option value="atraso">Atraso</option><option value="avaria">Avaria</option><option value="info">Informação</option></select></div>
        <div class="field"><label for="conteudo">O que aconteceu?</label>
          <textarea id="conteudo" name="conteudo" maxlength="500" placeholder="Descreve a ocorrência (máx. 500 caracteres)" required></textarea></div>
        <!-- A data é criada no servidor (NOW()), não no formulário. -->
        <button class="btn" type="submit">Publicar</button>
      </form>
    </section>

    <!-- ===== EDITAR PERFIL ===== -->
    <section class="card" aria-labelledby="t-perfil">
      <h2 id="t-perfil">Editar perfil</h2>
      <!-- enctype multipart é obrigatório para enviar a foto. BACKEND: validar tipo/tamanho da imagem. -->
      <form class="form" method="post" action="php/guardar_perfil.php" enctype="multipart/form-data">
        <div class="field"><label for="nome">Nome</label><input id="nome" name="nome" value="Rui Matos" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="rui@exemplo.pt" required></div>
        <div class="field"><label for="foto">Foto de perfil</label><input id="foto" name="foto" type="file" accept="image/*"></div>
        <div class="field"><label for="nova-pass">Nova palavra-passe (opcional)</label>
          <input id="nova-pass" name="nova_password" type="password" minlength="8" autocomplete="new-password"></div>
        <button class="btn" type="submit">Guardar alterações</button>
      </form>
    </section>
  </main>

  <!-- BARRA LATERAL (só ≥1100px). BACKEND: SELECT linha, COUNT(*) FROM posts WHERE data >= NOW() - INTERVAL 7 DAY GROUP BY linha ORDER BY 2 DESC LIMIT 5 -->
  <aside class="aside" aria-label="Linhas com mais ocorrências">
    <section class="card">
      <h2>Mais ocorrências esta semana</h2>
      <ul class="aside-list">
        <li><a href="posts.html?linha=301" class="line">301</a><span class="muted">12 posts</span></li>
        <li><a href="posts.html?linha=502" class="line">502</a><span class="muted">9 posts</span></li>
        <li><a href="posts.html?linha=801" class="line">801</a><span class="muted">4 posts</span></li>
      </ul>
    </section>
    <p class="muted">© 2026 BusCheck · Feito por passageiros, para passageiros.</p>
  </aside>
</body>
</html>
