<!DOCTYPE html>
<!-- index.html — BusCheck · Página inicial com a barra de navegação. -->
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <!-- Viewport: obrigatório para a resposividade do site -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início · BusCheck</title>
  <!-- Ligação ao CSS -->
  <link rel="stylesheet" href="Css/style.css">
</head>
<body>

  <!--"(acessibilidade: útil para quem navega com teclado) -->
  <a class="skip" href="#conteudo">Saltar para o conteúdo</a>

  <!-- NavBar: Esta dividido em três partes: logótipo | menu | botão de conta.
       O <nav> está DENTRO do <header> de propósito:
         |computador - centrado no cabeçalho
         |telemóvel  - o CSS transforma-o numa barra fixa em baixo -->
  <header class="topbar">

    <!-- Logótipo: link para a página inicial -->
    <a href="index.html" class="logo" aria-label="BusCheck, página inicial">Bus<span>Check</span></a>

    <!-- Menu Principal: aria-current="page" marca a página em que estamos a navegar (o CSS pinta-a de azul).
         quando criarem outras páginas, movam este atributo para o link correspondente. -->

    <!-- Ícones: Sao os ficheiros dentro da pasta ficheiros .svg na pasta img/ -->
    <nav class="nav" aria-label="Principal">
      <a href="index.html" aria-current="page">
        <img class="ico" src="img/home.svg" alt=""><span>Início</span>
      </a>
      <a href="posts.html">
        <img class="ico" src="img/search.svg" alt=""><span>Posts</span>
      </a>
      <a href="formulario.html">
        <img class="ico" src="img/plus.svg" alt=""><span>Publicar</span>
      </a>
      <a href="perfil.html">
        <img class="ico" src="img/user.svg" alt=""><span>Perfil</span>
      </a>
    </nav>

    <!-- Botao de login -->
    <a href="login.html" class="btn btn--sm">Entrar</a>

  </header>
</body>
</html>
