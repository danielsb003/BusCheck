<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <title>BusCheck</title>
</head>
<body>
   <header>
    <div class="logo">
        Bus<span>Check</span>
    </div>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#rotas">Rotas</a>
        <a href="#horarios">Horários</a>
        <a href="#sobre">Sobre</a>
    </nav>

    <button class="login-btn">Entrar</button>
</header> 
<main>

    <section id="inicio" class="hero">

        <div class="hero-text">
            <h1>Encontra o teu autocarro.</h1>

            <p>
                Consulta rotas, horários e paragens de forma
                rápida e simples.
            </p>

            <button class="main-btn">
                Ver rotas
            </button>
        </div>

        <div class="hero-card">
            <h2>Pesquisar viagem</h2>

            <input type="text" placeholder="De onde vais?">
            <input type="text" placeholder="Para onde vais?">

            <button class="search-btn">
                Pesquisar
            </button>
        </div>

    </section>
</body>
</html>
