<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusCheck</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
   <header>

    <div class="logo">
        Bus<span>Check</span>
    </div>
    <button class="login-btn">Entrar</button> 
    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="menu-btn"
           aria-label="Abrir ou fechar menu">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <nav>
        <a href="#inicio">Início</a>
        <a href="#rotas">Rotas</a>
        <a href="#horarios">Horários</a>
        <a href="#sobre">Sobre</a>
    </nav>

    

</header>
<main>

    <section id="inicio" class="hero">

        <div class="hero-text">
            <h1>Encontra o teu autocarro.</h1>

            <p>
                Consulta rotas, horários e paragens
                de forma rápida e simples.
            </p>

            <a href="#rotas" class="main-btn">
                Ver rotas
            </a>
        </div>

        <div class="hero-card">
            <h2>Pesquisar viagem</h2>

            <input type="text" placeholder="De onde vais?">
            <input type="text" placeholder="Para onde vais?">

            <button class="search-btn">Pesquisar</button>
        </div>

    </section>

</main>

    <footer>

    <div class="logo">
        Bus<span>Check</span>
    </div>

    <p>© 2026 BusCheck. Todos os direitos reservados.</p>

</footer>
</body>
</html>
